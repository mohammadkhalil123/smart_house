<article class="card" [class.detailed]="detailed" [attr.data-type]="type" [style.--c]="color">
  <div class="top">
    <span class="icon" aria-hidden="true">
      @switch (type) {
        @case ('temperature') {
          <svg viewBox="0 0 40 40" width="44" height="44" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 23V8a5 5 0 0 1 10 0v15a8 8 0 1 1-10 0Z"/><circle cx="20" cy="29" r="3.2" fill="currentColor" stroke="none"/><path d="M20 26V13" /></svg>
        }
        @case ('humidity') {
          <svg viewBox="0 0 40 40" width="44" height="44" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M20 4c7 9 12 14 12 21a12 12 0 0 1-24 0c0-7 5-12 12-21Z" fill="currentColor" fill-opacity=".25"/><path d="M14 26a6 6 0 0 0 6 6" stroke-linecap="round"/></svg>
        }
        @case ('luminosity') {
          <svg viewBox="0 0 40 40" width="44" height="44" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="20" cy="20" r="7"/><path d="M20 3v4M20 33v4M3 20h4M33 20h4M8 8l3 3M29 29l3 3M32 8l-3 3M11 29l-3 3"/></svg>
        }
      }
    </span>
    <div class="text">
      <span class="label">{{ label }}</span>
      <span class="value">
        @if (value !== null) {
          {{ value | number: digits }} <small>{{ unit }}</small>
        } @else {
          <span class="none">—</span>
        }
      </span>
    </div>
  </div>
  <div class="spark">
    <canvas #canvas [attr.aria-label]="label + ' history'" role="img"></canvas>
    @if (!points.length) {
      <p class="empty">No {{ label.toLowerCase() }} data for this period</p>
    }
  </div>
</article>
